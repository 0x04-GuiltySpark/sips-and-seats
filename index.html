<!doctype html>
<html lang="en-NZ"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111420"><title>Sips &amp; Seats</title>
<style>
:root{color-scheme:dark;--bg:#111420;--panel:#1c2132;--line:#343b51;--ink:#f4f1eb;--muted:#b5bdd0;--lime:#dcf88c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#30364b 0,transparent 45%),var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;min-height:100vh}main,header{max-width:1640px;margin:auto;padding:24px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1.3px}h2{font-size:clamp(32px,4vw,56px);line-height:1.1;letter-spacing:-1.5px}h3{font-size:21px;line-height:1.25}small,.muted{color:var(--muted)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:12px;min-height:52px;padding:10px 16px;color:var(--ink);background:var(--panel);max-width:100%}button{cursor:pointer;touch-action:manipulation;user-select:none;font-weight:650}button:hover{border-color:var(--lime)}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--lime);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--lime);color:#172015;border-color:var(--lime)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:750;color:var(--lime);margin-bottom:16px}.setup{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;padding-top:7vh}.intro p{max-width:510px;margin:24px 0;color:var(--muted);font-size:20px}.ballot{font-size:70px;color:var(--lime);margin-bottom:22px}.box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}.player-fields{display:grid;gap:14px;margin:24px 0}.field{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.field label{display:grid;gap:6px;min-width:0}.field input{width:100%;background:var(--bg)}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.error{color:#ffb6b6;min-height:26px}.warning{background:#543617;color:#ffe1ab;padding:14px 24px;border-bottom:1px solid #956632}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:0 0 26px}.score{background:var(--panel);padding:16px 20px;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;overflow-wrap:anywhere}.score strong{display:block;font-size:40px;line-height:1.2}.score span{font-weight:650}.overview{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.progress{width:180px;height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;background:var(--lime);height:100%}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filters button{font-size:14px;min-height:48px}.filters button[aria-pressed=true]{color:var(--lime);border-color:var(--lime);background:#2d3740}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}.tools input{flex:1;min-width:180px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:linear-gradient(140deg,#22293c,#1b2030);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}.card.claimed{background:#171c29}.card.claimed h3{color:#b8bfd1}.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:18px}.points{font-weight:800;color:var(--lime);white-space:nowrap}.penalty{font-size:12px;font-weight:750;border:1px solid #667859;color:#dcf88c;padding:4px 10px;border-radius:20px}.penalty.shot{color:#ffcc95;border-color:#8b6641}.penalty.finish{color:#e5b7ff;border-color:#78588d}.card p{color:var(--muted);margin:14px 0 22px;flex:1}.card button{width:100%}.category-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.owner{margin-bottom:12px;font-size:15px;overflow-wrap:anywhere}details{margin:24px 0;color:var(--muted);padding:16px 20px;border:1px solid var(--line);border-radius:14px}summary{cursor:pointer;color:var(--ink);min-height:32px}details p{margin-top:12px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:24px;width:min(540px,calc(100% - 24px));padding:28px;max-height:85vh;overflow:auto}dialog::backdrop{background:#090c15cc;backdrop-filter:blur(5px)}dialog h2{font-size:28px;letter-spacing:-.5px}dialog p{color:var(--muted);margin:16px 0}.choices{display:grid;gap:10px;margin:20px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));background:#e2f6b1;color:#182318;padding:18px 24px;border-radius:16px;box-shadow:0 10px 50px #0008;z-index:3;pointer-events:none}.toast strong{display:block}.empty{padding:40px;color:var(--muted)}[hidden]{display:none!important}footer{color:var(--muted);font-size:13px;margin-top:32px}@media(min-width:1500px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.setup{gap:28px}}@media(max-width:650px){main,header{padding:18px}.setup{grid-template-columns:1fr;padding-top:24px;gap:20px}.ballot{display:none}.intro p{font-size:17px;margin:16px 0}.cards{grid-template-columns:1fr}.card{padding:22px}.box{padding:20px}.scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}.score{padding:12px}.overview{align-items:start}h1{font-size:25px}header small{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<header><div><h1>Sips <span style="color:var(--lime)">&amp;</span> Seats</h1><small>NZ Election Night 2026</small></div><button id="new-game" hidden>New Game</button></header>
<div id="warning" class="warning" role="alert" hidden></div><main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="choices" class="choices"></div><button id="cancel">Cancel</button></dialog>
<script>
'use strict';
const CATALOGUE = [{"id": "magic-number", "title": "The magic number", "trigger": "Someone says “61 seats”, “path to power”, or “numbers to govern”. (An overhang can raise the actual majority threshold.)", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "kingmaker", "title": "Kingmaker alert", "trigger": "Qiulae Wong, Winston Peters, Opportunity, or someone else is described as a “kingmaker”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "too-close", "title": "Too early to tell", "trigger": "Someone says “too early to tell”, “too early to say”, “too close to call”, or “knife-edge”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "special-votes", "title": "Special votes, naturally", "trigger": "A presenter says special votes could change the outcome.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "overhang-word", "title": "Overhang!", "trigger": "The word “overhang” is spoken or appears on screen.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "cautiously-optimistic", "title": "Cautiously optimistic", "trigger": "A campaign spokesperson says “cautiously optimistic” or “we're feeling good”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "what-id-say", "title": "What I'll say to you is…", "trigger": "A politician says “what I'll say to you is”, “what I'd say to you is”, or a very close variant.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "laser-focused", "title": "Laser-focused", "trigger": "Any politician or commentator says “laser-focused”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "rhetoric", "title": "Rhetoric", "trigger": "Someone uses the word “rhetoric” in political commentary.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "mis-disinformation", "title": "Mis- and disinformation", "trigger": "Someone says “misinformation”, “disinformation”, or “mis-and-dis-information”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "john-key-mentioned", "title": "The ghost of John Key", "trigger": "Someone mentions John Key by name. An actual appearance is not required.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "coalition-calculator", "title": "Coalition calculator", "trigger": "Someone names at least three parties in a hypothetical governing coalition.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "chloe-disenfranchisement", "title": "Chlöe's favourite word", "trigger": "Chlöe Swarbrick says “disenfranchisement” or “disenfranchised”.", "category": "Political buzzwords & catchphrases", "points": 2, "penalty": "Sip"}, {"id": "qiulae-name", "title": "Say her name", "trigger": "Qiulae Wong's name is mispronounced, misspelled, or conspicuously avoided by a presenter.", "category": "Political buzzwords & catchphrases", "points": 2, "penalty": "Sip"}, {"id": "opportunity-threshold", "title": "The five-percent yo-yo", "trigger": "Opportunity is shown moving above or below the 5% party-vote threshold.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "seat-shuffle", "title": "The seat shuffle", "trigger": "A seat visibly changes party in a live projection/update.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "ruled-out-partner", "title": "We did not say that", "trigger": "A politician is challenged about a coalition partner their party previously ruled out.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "maori-electorates", "title": "Te Pāti Māori doubles up", "trigger": "Te Pāti Māori is projected/reported to win at least two electorates. (One card, not one per electorate.)", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "dramatic-reversal", "title": "The dramatic reversal", "trigger": "The projected governing bloc changes, then changes back again later in the night.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "hung-parliament", "title": "Hung parliament", "trigger": "Somebody solemnly says “hung parliament”.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "rangitikei", "title": "Rangitīkei represent", "trigger": "The Rangitīkei electorate gets a proper on-air mention or discussion.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "awkward-live-cross", "title": "Awkward live cross", "trigger": "A reporter cannot hear the studio or there's a painfully long live pause.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "politely-interrupted", "title": "Politely interrupted", "trigger": "Two studio panellists talk over one another while pretending not to.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "campaign-karaoke", "title": "Campaign HQ karaoke", "trigger": "Chants, cheers, or a questionable song drown out a live reporter.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "family-appears", "title": "Keeping it in the family", "trigger": "An MP's spouse, partner, or child speaks on the broadcast.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "winston-manoeuvre", "title": "The Winston manoeuvre", "trigger": "Winston Peters is asked a direct coalition question and answers something else.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "polling-dog", "title": "Polling-booth celebrity", "trigger": "A dog photographed/filmed at a polling place appears on the broadcast.", "category": "Live TV & campaign HQ chaos", "points": 3, "penalty": "Sip"}, {"id": "presenter-loses-it", "title": "Presenter loses the plot", "trigger": "A host laughs, swears, or struggles to keep a straight face at a political moment.", "category": "Live TV & campaign HQ chaos", "points": 3, "penalty": "Sip"}, {"id": "mp-drunk", "title": "One too many at HQ", "trigger": "A sitting MP is clearly shown or explicitly described on air as intoxicated. First such incident only. Don't infer intoxication from mere awkwardness.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "rawiri-cowboy", "title": "Cowboy Rāwiri", "trigger": "Rāwiri Waititi appears wearing a cowboy hat.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "mp-racist", "title": "Did they really say that?", "trigger": "An MP makes an unmistakably racist remark on air. Don't count rumours, ambiguous quotes, or allegations not shown/verified in the coverage.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "mp-gang", "title": "Unexpected company", "trigger": "An MP is shown celebrating with people your group identifies as gang members. The broadcast does not need to identify them.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "forced-resignation", "title": "You're fired (sort of)", "trigger": "A sitting MP is forced to resign or their forced resignation is announced during election-night coverage.", "category": "Politicians behaving badly (rare events)", "points": 5, "penalty": "Shot"}, {"id": "leader-resigns", "title": "Exit, stage left", "trigger": "A party leader announces their resignation as leader during coverage.", "category": "Politicians behaving badly (rare events)", "points": 5, "penalty": "Shot"}, {"id": "nicola-returns", "title": "Nicola survives the list", "trigger": "The election-night count or broadcast clearly projects Nicola Willis returning to Parliament as a National list MP. She's a list-only candidate in 2026, not an electorate candidate; her return is uncertain because National may win more electorates than its party vote entitles it to. Count a clear election-night projection, not a passing hypothetical.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "seymour-transport", "title": "Seymour's grand entrance", "trigger": "David Seymour arrives at the election-night venue in something other than a car (boat, bike, helicopter, etc.). This is a nod to his 2020 speedboat arrival.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "winston-dart", "title": "Winston's smoke break", "trigger": "Winston Peters is clearly shown smoking a cigarette during coverage.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "luxon-opportunity-uturn", "title": "Coalition U-turn", "trigger": "Christopher Luxon explicitly reverses a previous refusal to work with Opportunity and rules it in as a possible coalition partner.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}];
const RETIRED_CARD_IDS=['clear-as-mud','explaining-overhang'];
const LEGACY_CARD_IDS=[...RETIRED_CARD_IDS,'manawatu'];
const KEY='sips-and-seats:v1';
const app=document.querySelector('#app'),dialog=document.querySelector('#dialog');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let invalidSave=false;
let game=null,names=['',''],category='All',status='All',search='',toastTimer;
const categories=[...new Set(CATALOGUE.map(c=>c.category))];
function warn(message){const el=document.querySelector('#warning');el.textContent=message;el.hidden=false;}
function valid(g){
 if(!g||g.schemaVersion!==1||!Array.isArray(g.players)||g.players.length<2||!g.claims||typeof g.claims!=='object'||Array.isArray(g.claims)||!Number.isFinite(Date.parse(g.createdAt)))return false;
 const ids=new Set(),ns=new Set();
 for(const p of g.players){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name!==p.name.trim()||p.name.length>30||ns.has(p.name.toLocaleLowerCase()))return false;ids.add(p.id);ns.add(p.name.toLocaleLowerCase());}
 return Object.entries(g.claims).every(([id,c])=>(CATALOGUE.some(x=>x.id===id)||LEGACY_CARD_IDS.includes(id))&&c&&ids.has(c.playerId)&&typeof c.claimedAt==='string'&&Number.isFinite(Date.parse(c.claimedAt)));
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(game));}catch(e){warn('Browser saving is unavailable. This game is only in memory and may be lost on reload.');}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const g=JSON.parse(raw);if(!valid(g))throw Error('Invalid save');game=g;const migrated=LEGACY_CARD_IDS.some(id=>Object.hasOwn(game.claims,id));if(game.claims.manawatu&&!game.claims.rangitikei)game.claims.rangitikei=game.claims.manawatu;for(const id of LEGACY_CARD_IDS)delete game.claims[id];if(migrated)persist();}}catch(e){invalidSave=true;warn('The saved game could not be loaded. It has been left untouched. Use New Game to clear it, or recover it from browser storage before starting again.');document.querySelector('#new-game').hidden=false;}}
function accent(i){return `hsl(${(i*137.508+75)%360} 72% 75%)`;}
function modal(title,copy,options){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;const el=document.querySelector('#choices');el.replaceChildren();for(const [label,fn] of options){const b=document.createElement('button');b.textContent=label;b.className='primary';b.onclick=()=>{dialog.close();fn();};el.append(b);}dialog.showModal();}
document.querySelector('#cancel').onclick=()=>dialog.close();
document.querySelector('#new-game').onclick=()=>modal('Start a new game?','All current game data will be lost: players, claims and game settings. This cannot be undone.',[['Delete game and return to setup',()=>{try{localStorage.removeItem(KEY);}catch(e){warn('The browser would not delete the save. Enable site storage before starting a new game.');return;}game=null;invalidSave=false;names=['',''];category='All';status='All';search='';clearTimeout(toastTimer);document.querySelector('#toast').hidden=true;document.querySelector('#warning').hidden=true;render();}]]);
function setup(){app.innerHTML=`<section class="setup"><div class="intro"><div class="ballot" aria-hidden="true">▣ ✓</div><div class="eyebrow">Your sofa. Your election night.</div><h2>Watch the seats.<br>Spot the moment.<br><span style="color:var(--lime)">Take the points.</span></h2><p>A little friendly competition for a very long night. Gather your crew, pick your drinks and keep an eye on the coverage.</p><small>${CATALOGUE.length} moments · 5 categories · one shared device</small></div><form class="box" id="setup" novalidate><div class="eyebrow">New Game Setup</div><h3>Who's watching?</h3><p class="muted">Two or more players. Everyone starts at zero.</p><div class="player-fields">${names.map((n,i)=>`<div class="field"><label>Player ${i+1}<input data-name="${i}" placeholder="Player ${i+1}" maxlength="30" autocomplete="off" value="${esc(n)}"></label><button type="button" data-remove="${i}" aria-label="Remove player ${i+1}" ${names.length<=2?'disabled':''}>Remove</button></div>`).join('')}</div><p id="setup-error" class="error" role="alert"></p><div class="actions"><button type="button" id="add">+ Add player</button><button class="primary" type="submit">Start Game →</button></div><p class="muted" style="font-size:13px;margin-top:22px">Saved in this browser. Drinks are always optional; skipping or substituting never costs points.</p></form></section>`;
 app.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>{names[+el.dataset.name]=el.value;});
 app.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{names.splice(+el.dataset.remove,1);setup();});
 document.querySelector('#add').onclick=()=>{names.push('');setup();app.querySelector(`[data-name="${names.length-1}"]`).focus();};
 document.querySelector('#setup').onsubmit=e=>{e.preventDefault();if(invalidSave){document.querySelector('#setup-error').textContent='Use New Game above to confirm deleting the unreadable save first.';return;}const ns=names.map(n=>n.trim());let error='';if(ns.length<2||ns.some(n=>!n||n.length>30))error='Enter a name of 1–30 characters for every player.';else if(new Set(ns.map(n=>n.toLocaleLowerCase())).size!==ns.length)error='Each player needs a different name (capital letters do not make it different).';if(error){document.querySelector('#setup-error').textContent=error;return;}game={schemaVersion:1,createdAt:new Date().toISOString(),players:ns.map((name,i)=>({id:'p_'+Date.now().toString(36)+'_'+i+'_'+Math.random().toString(36).slice(2),name})),claims:{}};persist();render();};
}
function claim(card,id){if(!game||game.claims[card.id])return;const p=game.players.find(p=>p.id===id);if(!p)return;game.claims[card.id]={playerId:id,claimedAt:new Date().toISOString()};persist();render();const t=document.querySelector('#toast');t.innerHTML=`<strong>${esc(p.name)} +${card.points} points</strong>${game.players.filter(p=>p.id!==id).map(p=>esc(p.name)).join(', ')}: ${card.penalty}`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,6500);}
function filtered(c){return (category==='All'||c.category===category)&&(status==='All'||(status==='Claimed')===!!game.claims[c.id])&&(`${c.title} ${c.trigger}`.toLocaleLowerCase().includes(search.toLocaleLowerCase()));}
function renderCards(){const selected=CATALOGUE.filter(filtered);document.querySelector('#cards').innerHTML=selected.map(c=>{const cl=game.claims[c.id],owner=cl&&game.players.find(p=>p.id===cl.playerId);return `<article class="card ${cl?'claimed':''}"><div class="meta"><span class="points">+${c.points} pts</span><span class="penalty ${c.penalty==='Shot'?'shot':c.penalty==='Sip'?'':'finish'}">${c.penalty}</span></div><div class="category-label">${esc(c.category)}</div><h3>${esc(c.title)}</h3><p>${esc(c.trigger)}</p>${owner?`<div class="owner">✓ Claimed by <strong>${esc(owner.name)}</strong></div><button data-undo="${c.id}">Undo claim</button>`:`<button class="primary" data-claim="${c.id}" aria-label="Claim: ${esc(c.title)}">Claim →</button>`}</article>`;}).join('')||'<p class="empty">No cards match this view.</p>';
 app.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const c=CATALOGUE.find(c=>c.id===b.dataset.claim);modal('Who spotted it first?',c.title+' · '+c.points+' points · others: '+c.penalty,game.players.map(p=>[p.name,()=>claim(c,p.id)]));});
 app.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{const c=CATALOGUE.find(c=>c.id===b.dataset.undo);modal('Undo this claim?',`“${c.title}” will be available again and its points will be removed.`,[['Undo claim',()=>{delete game.claims[c.id];persist();render();}]]);});
}
function render(){document.querySelector('#new-game').hidden=!game&&!invalidSave;if(!game){setup();return;}const count=Object.keys(game.claims).length;
 app.innerHTML=`<section class="scoreboard" aria-label="Player scores">${game.players.map((p,i)=>`<div class="score" style="--accent:${accent(i)}"><span>${esc(p.name)}</span><strong>${CATALOGUE.reduce((sum,c)=>sum+(game.claims[c.id]?.playerId===p.id?c.points:0),0)} <small style="font-size:14px">pts</small></strong></div>`).join('')}</section><div class="overview"><div><div class="eyebrow" style="margin:0">The election-night watchlist</div><h3>First to spot it takes the points.</h3></div><div><strong>${count} / ${CATALOGUE.length} claimed</strong><div class="progress" aria-hidden="true"><i style="width:${count/CATALOGUE.length*100}%"></i></div></div></div><div class="filters" aria-label="Category">${['All',...categories].map((cat,i)=>`<button data-category="${i}" aria-pressed="${cat===category}">${cat==='All'?'All categories':esc(cat)} <small>(${CATALOGUE.filter(c=>cat==='All'||c.category===cat).length})</small></button>`).join('')}</div><div class="tools"><select id="status" aria-label="Claim status">${['All','Available','Claimed'].map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select><input id="search" aria-label="Search cards" placeholder="Search moments…" value="${esc(search)}" type="search"><button id="reset-view">Reset view</button></div><section id="cards" class="cards" aria-label="Election moments"></section><details><summary>House rules &amp; browser saves</summary><p>First to spot an event earns its points. Each card can be claimed once for the whole night. If one TV moment matches several cards, count only one card; separate moments can score separately.</p><p>Everyone except the claimant receives the listed penalty. Anyone can skip or substitute a drink and still score. Agree the moment together before claiming.</p><p>This is one shared device. Saves live only in this browser at this address, with no cross-device syncing. Keep the same address and port when returning.</p></details><footer>Sips &amp; Seats · Your coverage, your calls.</footer>`;
 app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=['All',...categories][+b.dataset.category];render();});document.querySelector('#status').onchange=e=>{status=e.target.value;renderCards();};document.querySelector('#search').oninput=e=>{search=e.target.value;renderCards();};document.querySelector('#reset-view').onclick=()=>{category='All';status='All';search='';render();};renderCards();
}
load();render();
</script></html>
