<style>

:26px}.warning{background:#543617;color:#ffe1ab;padding:14px 24px;border-bottom:1px solid #956632}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:0 0 26px}.score{background:var(--panel);padding:16px 20px;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;overflow-wrap:anywhere}.score strong{display:block;font-size:40px;line-height:1.2}.score span{font-weight:650}.overview{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.progress{width:180px;height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;background:var(--lime);height:100%}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filters button{font-size:14px;min-height:48px}.filters button[aria-pressed=true]{color:var(--lime);border-color:var(--lime);background:#2d3740}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}.tools input{flex:1;min-width:180px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:linear-gradient(140deg,#22293c,#1b2030);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}.card.claimed{background:#171c29}.card.claimed h3{color:#b8bfd1}.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:18px}.points{font-weight:800;color:var(--lime);white-space:nowrap}.penalty{font-size:12px;font-weight:750;border:1px solid #667859;color:#dcf88c;padding:4px 10px;border-radius:20px}.penalty.shot{color:#ffcc95;border-color:#8b6641}.penalty.finish{color:#e5b7ff;border-color:#78588d}.card p{color:var(--muted);margin:14px 0 22px;flex:1}.card button{width:100%}.category-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.owner{margin-bottom:12px;font-size:15px;overflow-wrap:anywhere}details{margin:24px 0;color:var(--muted);padding:16px 20px;border:1px solid var(--line);border-radius:14px}summary{cursor:pointer;color:var(--ink);min-height:32px}details p{margin-top:12px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:24px;width:min(540px,calc(100% - 24px));padding:28px;max-height:85vh;overflow:auto}dialog::backdrop{background:#090c15cc;backdrop-filter:blur(5px)}dialog h2{font-size:28px;letter-spacing:-.5px}dialog p{color:var(--muted);margin:16px 0}.choices{display:grid;gap:10px;margin:20px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));background:#e2f6b1;color:#182318;padding:18px 24px;border-radius:16px;box-shadow:0 10px 50px #0008;z-index:3;pointer-events:none}.toast strong{display:block}.empty{padding:40px;color:var(--muted)}[hidden]{display:none!important}footer{color:var(--muted);font-size:13px;margin-top:32px}@media(min-width:1500px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.setup{gap:28px}}@media(max-width:650px){main,header{padding:18px}.setup{grid-template-columns:1fr;padding-top:24px;gap:20px}.ballot{display:none}.intro p{font-size:17px;margin:16px 0}.cards{grid-template-columns:1fr}.card{padding:22px}.box{padding:20px}.scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}.score{padding:12px}.overview{align-items:start}h1{font-size:25px}header small{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.board-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:26px;flex-wrap:wrap}.board-picker{display:grid;gap:6px;min-width:180px;color:var(--muted)}.board-picker select{color:var(--ink)}.full-house{padding:20px;border:1px solid var(--lime);border-radius:16px;color:var(--lime);margin-bottom:24px}.results{max-width:1100px;margin:auto}.results-intro{margin:20px 0;max-width:750px}.result-list{list-style:none;padding:0;margin:24px 0;display:grid;gap:10px}.result-row{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel)}.rank{font-size:24px;color:var(--lime);min-width:28px}.result-name{flex:1;min-width:0;overflow-wrap:anywhere}.result-name small{display:block}.result-points{font-size:26px;white-space:nowrap}.result-points small{font-size:14px}.result-panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.result-panels .box{min-width:0}.result-panels p{margin-top:12px}.input-label{display:block;margin:18px 0 6px}.result-panels input,.result-panels select,.result-panels textarea{width:100%}.result-panels textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;resize:vertical;line-height:1.6;margin-bottom:16px}.result-panels textarea:focus-visible{outline:3px solid var(--lime);outline-offset:3px}@media(max-width:650px){.result-panels{grid-template-columns:1fr}.result-row{flex-wrap:wrap;gap:12px}.result-points{font-size:22px}.result-row button{margin-left:40px}.overview{flex-wrap:wrap}.scoreboard:has(.score:only-child){grid-template-columns:1fr}}
</style>
<header><div><h1>Sips <span style="color:var(--lime)">&amp;</span> Seats</h1><small>NZ Election Night 2026</small></div><button id="new-game" hidden>New Game</button></header>
<div id="warning" class="warning" role="alert" hidden></div><main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="choices" class="choices"></div><button id="cancel">Cancel</button></dialog>
<script>
'use strict';
const CATALOGUE = [{"id": "magic-number", "title": "The magic number", "trigger": "Someone says “61 seats”, “path to power”, or “numbers to govern”. (An overhang can raise the actual majority threshold.)", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "kingmaker", "title": "Kingmaker alert", "trigger": "Qiulae Wong, Winston Peters, Opportunity, or someone else is described as a “kingmaker”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "too-close", "title": "Too early to tell", "trigger": "Someone says “too early to tell”, “too early to say”, “too close to call”, or “knife-edge”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "special-votes", "title": "Special votes, naturally", "trigger": "A presenter says special votes could change the outcome.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "overhang-word", "title": "Overhang!", "trigger": "The word “overhang” is spoken or appears on screen.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "cautiously-optimistic", "title": "Cautiously optimistic", "trigger": "A campaign spokesperson says “cautiously optimistic” or “we're feeling good”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "what-id-say", "title": "What I'll say to you is…", "trigger": "A politician says “what I'll say to you is”, “what I'd say to you is”, or a very close variant.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "laser-focused", "title": "Laser-focused", "trigger": "Any politician or commentator says “laser-focused”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "rhetoric", "title": "Rhetoric", "trigger": "Someone uses the word “rhetoric” in political commentary.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "mis-disinformation", "title": "Mis- and disinformation", "trigger": "Someone says “misinformation”, “disinformation”, or “mis-and-dis-information”.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "john-key-mentioned", "title": "The ghost of John Key", "trigger": "Someone mentions John Key by name. An actual appearance is not required.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "coalition-calculator", "title": "Coalition calculator", "trigger": "Someone names at least three parties in a hypothetical governing coalition.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "chloe-disenfranchisement", "title": "Chlöe's favourite word", "trigger": "Chlöe Swarbrick says “disenfranchisement” or “disenfranchised”.", "category": "Political buzzwords & catchphrases", "points": 2, "penalty": "Sip"}, {"id": "marama-tax-the-rich", "title": "Marama sends the bill", "trigger": "Marama Davidson says “tax the rich”, “tax the super-rich”, or explicitly calls for a wealth tax during the broadcast.", "category": "Political buzzwords & catchphrases", "points": 1, "penalty": "Sip"}, {"id": "qiulae-name", "title": "Say her name", "trigger": "Qiulae Wong's name is mispronounced, misspelled, or conspicuously avoided by a presenter.", "category": "Political buzzwords & catchphrases", "points": 2, "penalty": "Sip"}, {"id": "opportunity-threshold", "title": "The five-percent yo-yo", "trigger": "Opportunity is shown moving above or below the 5% party-vote threshold.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "seat-shuffle", "title": "The seat shuffle", "trigger": "A seat visibly changes party in a live projection/update.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "ruled-out-partner", "title": "We did not say that", "trigger": "A politician is challenged about a coalition partner their party previously ruled out.", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "maori-electorates", "title": "Te Pāti Māori doubles up", "trigger": "Te Pāti Māori is projected/reported to win at least two electorates. (One card, not one per electorate.)", "category": "Results, MMP & election maths", "points": 2, "penalty": "Sip"}, {"id": "dramatic-reversal", "title": "The dramatic reversal", "trigger": "The projected governing bloc changes, then changes back again later in the night.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "hung-parliament", "title": "Hung parliament", "trigger": "Somebody solemnly says “hung parliament”.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "rangitikei", "title": "Rangitīkei represent", "trigger": "The Rangitīkei electorate gets a proper on-air mention or discussion.", "category": "Results, MMP & election maths", "points": 3, "penalty": "Sip"}, {"id": "awkward-live-cross", "title": "Awkward live cross", "trigger": "A reporter cannot hear the studio or there's a painfully long live pause.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "politely-interrupted", "title": "Politely interrupted", "trigger": "Two studio panellists talk over one another while pretending not to.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "campaign-karaoke", "title": "Campaign HQ karaoke", "trigger": "Chants, cheers, or a questionable song drown out a live reporter.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "family-appears", "title": "Keeping it in the family", "trigger": "An MP's spouse, partner, or child speaks on the broadcast.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "winston-manoeuvre", "title": "The Winston manoeuvre", "trigger": "Winston Peters is asked a direct coalition question and answers something else.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "chippy-sausage-roll", "title": "Chippy’s sausage-roll watch", "trigger": "Chris Hipkins is shown eating or holding a sausage roll, or someone on the broadcast mentions his sausage-roll obsession.", "category": "Live TV & campaign HQ chaos", "points": 2, "penalty": "Sip"}, {"id": "polling-dog", "title": "Polling-booth celebrity", "trigger": "A dog photographed/filmed at a polling place appears on the broadcast.", "category": "Live TV & campaign HQ chaos", "points": 3, "penalty": "Sip"}, {"id": "presenter-loses-it", "title": "Presenter loses the plot", "trigger": "A host laughs, swears, or struggles to keep a straight face at a political moment.", "category": "Live TV & campaign HQ chaos", "points": 3, "penalty": "Sip"}, {"id": "mp-drunk", "title": "One too many at HQ", "trigger": "A sitting MP is clearly shown or explicitly described on air as intoxicated. First such incident only. Don't infer intoxication from mere awkwardness.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "rawiri-cowboy", "title": "Cowboy Rāwiri", "trigger": "Rāwiri Waititi appears wearing a cowboy hat.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "mp-racist", "title": "Did they really say that?", "trigger": "An MP makes an unmistakably racist remark on air. Don't count rumours, ambiguous quotes, or allegations not shown/verified in the coverage.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "mp-gang", "title": "Unexpected company", "trigger": "An MP is shown celebrating with people your group identifies as gang members. The broadcast does not need to identify them.", "category": "Politicians behaving badly (rare events)", "points": 4, "penalty": "Shot"}, {"id": "forced-resignation", "title": "You're fired (sort of)", "trigger": "A sitting MP is forced to resign or their forced resignation is announced during election-night coverage.", "category": "Politicians behaving badly (rare events)", "points": 5, "penalty": "Shot"}, {"id": "leader-resigns", "title": "Exit, stage left", "trigger": "A party leader announces their resignation as leader during coverage.", "category": "Politicians behaving badly (rare events)", "points": 5, "penalty": "Shot"}, {"id": "nicola-returns", "title": "Nicola survives the list", "trigger": "The election-night count or broadcast clearly projects Nicola Willis returning to Parliament as a National list MP. She's a list-only candidate in 2026, not an electorate candidate; her return is uncertain because National may win more electorates than its party vote entitles it to. Count a clear election-night projection, not a passing hypothetical.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "seymour-transport", "title": "Seymour's grand entrance", "trigger": "David Seymour arrives at the election-night venue in something other than a car (boat, bike, helicopter, etc.). This is a nod to his 2020 speedboat arrival.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "winston-dart", "title": "Winston's smoke break", "trigger": "Winston Peters is clearly shown smoking a cigarette during coverage.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}, {"id": "luxon-opportunity-uturn", "title": "Coalition U-turn", "trigger": "Christopher Luxon explicitly reverses a previous refusal to work with Opportunity and rules it in as a possible coalition partner.", "category": "Legendary events (finish your drink)", "points": 5, "penalty": "Finish your drink"}];
const LEGACY_CARD_IDS = ['clear-as-mud', 'explaining-overhang', 'manawatu'];
const KEY = 'sips-and-seats:v1';
const MAX_POINTS = CATALOGUE.reduce((sum, card) => sum + card.points, 0);
const categories = [...new Set(CATALOGUE.map(card => card.category))];
const app = document.querySelector('#app');
const dialog = document.querySelector('#dialog');
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
let game = null, invalidSave = false, names = [''], activePlayerId = '';
let category = 'All', status = 'All', search = '', view = 'board', toastTimer;

function valid(g) {
  if (!g || ![1, 2].includes(g.schemaVersion) || !Array.isArray(g.players) || !g.players.length || !Number.isFinite(Date.parse(g.createdAt))) return false;
  const ids = new Set(), playerNames = new Set();
  for (const player of g.players) {
    if (!player || typeof player.id !== 'string' || !player.id || ids.has(player.id) || typeof player.name !== 'string' || !player.name.trim() || player.name !== player.name.trim() || player.name.length > 30 || playerNames.has(player.name.toLocaleLowerCase())) return false;
    ids.add(player.id);
    playerNames.add(player.name.toLocaleLowerCase());
  }
  if (g.schemaVersion === 1) {
    if (!g.claims || typeof g.claims !== 'object' || Array.isArray(g.claims)) return false;
    return Object.entries(g.claims).every(([id, claim]) =>
      (CATALOGUE.some(card => card.id === id) || LEGACY_CARD_IDS.includes(id)) &&
      claim && ids.has(claim.playerId) && typeof claim.claimedAt === 'string' && Number.isFinite(Date.parse(claim.claimedAt)));
  }
  if (!g.ticks || typeof g.ticks !== 'object' || Array.isArray(g.ticks) || Object.keys(g.ticks).length !== ids.size) return false;
  for (const id of ids) {
    if (!Object.hasOwn(g.ticks, id)) return false;
    const ticks = g.ticks[id];
    if (!ticks || typeof ticks !== 'object' || Array.isArray(ticks) ||
      !Object.entries(ticks).every(([cardId, date]) => CATALOGUE.some(card => card.id === cardId) && typeof date === 'string' && Number.isFinite(Date.parse(date)))) return false;
  }
  if (!Array.isArray(g.comparisons)) return false;
  const resultIds = new Set();
  for (const result of g.comparisons) {
    if (!result || typeof result.id !== 'string' || !result.id || resultIds.has(result.id) ||
      typeof result.name !== 'string' || !result.name.trim() || result.name !== result.name.trim() || result.name.length > 30 ||
      playerNames.has(result.name.toLocaleLowerCase()) || !Number.isInteger(result.points) || result.points < 0 || result.points > MAX_POINTS) return false;
    resultIds.add(result.id);
    playerNames.add(result.name.toLocaleLowerCase());
  }
  return true;
}

function warn(message) {
  const element = document.querySelector('#warning');
  element.textContent = message;
  element.hidden = false;
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(game));
  } catch (error) {
    warn('Browser saving is unavailable. This game is only in memory and may be lost on reload.');
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!valid(saved)) throw Error('Invalid save');
    const migrated = saved.schemaVersion === 1;
    if (migrated) {
      saved.ticks = Object.fromEntries(saved.players.map(player => [player.id, {}]));
      for (const [oldId, claim] of Object.entries(saved.claims)) {
        const cardId = oldId === 'manawatu' ? 'rangitikei' : oldId;
        if (CATALOGUE.some(card => card.id === cardId)) saved.ticks[claim.playerId][cardId] = claim.claimedAt;
      }
      delete saved.claims;
      saved.schemaVersion = 2;
      saved.comparisons = [];
    }
    game = saved;
    activePlayerId = game.players[0].id;
    if (migrated) persist();
  } catch (error) {
    game = null;
    invalidSave = true;
    warn('The saved game could not be loaded. It has been left untouched. Use New Game to clear it, or recover it from browser storage before starting again.');
  }
}

function modal(title, copy, options) {
  document.querySelector('#dialog-title').textContent = title;
  document.querySelector('#dialog-copy').textContent = copy;
  const choices = document.querySelector('#choices');
  choices.replaceChildren();
  for (const [label, action] of options) {
    const button = document.createElement('button');
    button.textContent = label;
    button.className = 'primary';
    button.onclick = () => { dialog.close(); action(); };
    choices.append(button);
  }
  dialog.showModal();
}

document.querySelector('#cancel').onclick = () => dialog.close();
document.querySelector('#new-game').onclick = () => modal(
  'Start a new game?',
  'All players, ticks and comparison scores on this device will be lost. This cannot be undone.',
  [['Delete game and return to setup', () => {
    try {
      localStorage.removeItem(KEY);
    } catch (error) {
      warn('The browser would not delete the save. Enable site storage before starting a new game.');
      return;
    }
    game = null;
    invalidSave = false;
    names = [''];
    activePlayerId = '';
    category = 'All';
    status = 'All';
    search = '';
    view = 'board';
    clearTimeout(toastTimer);
    document.querySelector('#toast').hidden = true;
    document.querySelector('#warning').hidden = true;
    render();
  }]]
);

function setup() {
  app.innerHTML = '<section class="setup"><div class="intro"><div class="ballot" aria-hidden="true">▣ ✓</div>' +
    '<div class="eyebrow">Your sofa. Your election night.</div><h2>Watch the seats.<br>Spot the moment.<br>' +
    '<span style="color:var(--lime)">Fill your board.</span></h2><p>Election-night bingo, your way. Play solo, pass a device around or compare scores with friends watching from home. Everyone can score the same moment.</p>' +
    '<small>' + CATALOGUE.length + ' moments · ' + categories.length + ' categories · one board per player</small></div>' +
    '<form class="box" id="setup" novalidate><div class="eyebrow">New Game Setup</div><h3>Who’s watching?</h3>' +
    '<p class="muted">One player is all you need. Add more if you’re sharing this device.</p><div class="player-fields">' +
    names.map((name, index) => '<div class="field"><label>Player ' + (index + 1) +
      '<input data-name="' + index + '" placeholder="Your name" maxlength="30" autocomplete="off" value="' + esc(name) + '"></label>' +
      '<button type="button" data-remove="' + index + '" aria-label="Remove player ' + (index + 1) + '" ' + (names.length <= 1 ? 'disabled' : '') + '>Remove</button></div>').join('') +
    '</div><p id="setup-error" class="error" role="alert"></p><div class="actions"><button type="button" id="add">+ Add player</button>' +
    '<button class="primary" type="submit">Start Game →</button></div><p class="muted" style="font-size:13px;margin-top:22px">Friends on other devices start their own games. Compare totals at the end. Drinks are always optional.</p></form></section>';
  app.querySelectorAll('[data-name]').forEach(input => input.oninput = () => { names[+input.dataset.name] = input.value; });
  app.querySelectorAll('[data-remove]').forEach(button => button.onclick = () => {
    if (names.length <= 1) return;
    names.splice(+button.dataset.remove, 1);
    setup();
  });
  document.querySelector('#add').onclick = () => {
    names.push('');
    setup();
    app.querySelector('[data-name="' + (names.length - 1) + '"]').focus();
  };
  document.querySelector('#setup').onsubmit = event => {
    event.preventDefault();
    if (invalidSave) {
      document.querySelector('#setup-error').textContent = 'Use New Game above to confirm deleting the unreadable save first.';
      return;
    }
    const playerNames = names.map(name => name.trim());
    let error = '';
    if (!playerNames.length || playerNames.some(name => !name || name.length > 30)) error = 'Enter a name of 1–30 characters for every player.';
    else if (new Set(playerNames.map(name => name.toLocaleLowerCase())).size !== playerNames.length) error = 'Each player needs a different name (capital letters do not make it different).';
    if (error) {
      document.querySelector('#setup-error').textContent = error;
      return;
    }
    const players = playerNames.map((name, index) => ({id: 'p_' + Date.now().toString(36) + '_' + index + '_' + Math.random().toString(36).slice(2), name}));
    game = {schemaVersion: 2, createdAt: new Date().toISOString(), players, ticks: Object.fromEntries(players.map(player => [player.id, {}])), comparisons: []};
    activePlayerId = players[0].id;
    persist();
    render();
  };
}

function scoreFor(playerId) {
  return CATALOGUE.reduce((sum, card) => sum + (Object.hasOwn(game.ticks[playerId], card.id) ? card.points : 0), 0);
}

function tickCard(card) {
  const ticks = game.ticks[activePlayerId];
  if (Object.hasOwn(ticks, card.id)) return;
  ticks[card.id] = new Date().toISOString();
  persist();
  render();
  const button = app.querySelector('[data-tick="' + card.id + '"]');
  if (button) button.focus({preventScroll: true});
  const player = game.players.find(player => player.id === activePlayerId);
  const toast = document.querySelector('#toast');
  toast.innerHTML = '<strong>' + esc(player.name) + ' +' + card.points + ' points</strong>' +
    Object.keys(ticks).length + ' / ' + CATALOGUE.length + ' moments ticked · Optional drink: ' + esc(card.penalty);
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.hidden = true, 5000);
}

function filtered(card) {
  const ticked = Object.hasOwn(game.ticks[activePlayerId], card.id);
  return (category === 'All' || card.category === category) &&
    (status === 'All' || (status === 'Ticked') === ticked) &&
    (card.title + ' ' + card.trigger).toLocaleLowerCase().includes(search.toLocaleLowerCase());
}

function renderCards() {
  const selected = CATALOGUE.filter(filtered);
  document.querySelector('#cards').innerHTML = selected.map(card => {
    const ticked = Object.hasOwn(game.ticks[activePlayerId], card.id);
    return '<article class="card ' + (ticked ? 'claimed' : '') + '"><div class="meta"><span class="points">+' + card.points +
      ' pts</span><span class="penalty ' + (card.penalty === 'Shot' ? 'shot' : card.penalty === 'Sip' ? '' : 'finish') +
      '" title="Optional drink">' + esc(card.penalty) + '</span></div><div class="category-label">' + esc(card.category) +
      '</div><h3>' + esc(card.title) + '</h3><p>' + esc(card.trigger) + '</p><button class="' + (ticked ? '' : 'primary') +
      '" data-tick="' + card.id + '" aria-pressed="' + ticked + '" aria-label="' + (ticked ? 'Undo tick: ' : 'Tick off: ') +
      esc(card.title) + '">' + (ticked ? '✓ Ticked · Undo' : 'Tick it off →') + '</button></article>';
  }).join('') || '<p class="empty">No cards match this view.</p>';
  app.querySelectorAll('[data-tick]').forEach(button => button.onclick = () => {
    const card = CATALOGUE.find(card => card.id === button.dataset.tick);
    if (Object.hasOwn(game.ticks[activePlayerId], card.id)) {
      delete game.ticks[activePlayerId][card.id];
      persist();
      render();
      const button = app.querySelector('[data-tick="' + card.id + '"]');
      if (button) button.focus({preventScroll: true});
    } else tickCard(card);
  });
}

function renderResults() {
  const player = game.players.find(player => player.id === activePlayerId);
  const results = [
    ...game.players.map(player => ({id: player.id, name: player.name, points: scoreFor(player.id), local: true})),
    ...game.comparisons.map(result => ({...result, local: false}))
  ].sort((a, b) => b.points - a.points);
  let rank = 0;
  const rows = results.map((result, index) => {
    if (index === 0 || result.points !== results[index - 1].points) rank = index + 1;
    return '<li class="result-row"><strong class="rank">' + rank + '</strong><div class="result-name"><strong>' + esc(result.name) +
      '</strong><small>' + (result.local ? 'This device' : 'Friend’s reported score') + '</small></div><strong class="result-points">' +
      result.points + '<small> pts</small></strong>' + (result.local ? '' : '<button data-remove-result="' + esc(result.id) +
      '" aria-label="Remove result for ' + esc(result.name) + '">Remove</button>') + '</li>';
  }).join('');
  app.innerHTML = '<section class="results"><div class="actions"><button id="back-board">← Back to my board</button></div>' +
    '<div class="eyebrow" style="margin-top:24px">The end-of-night bragging rights</div><h2>Results &amp; compare</h2>' +
    '<p class="muted results-intro">Highest points wins. Equal totals tie. Share your score with friends and add their totals below. You can keep ticking and return here at any time.</p>' +
    '<ol class="result-list" aria-label="Score rankings">' + rows + '</ol><div class="result-panels"><section class="box">' +
    '<h3>Share your score</h3><label class="input-label" for="result-player">Player</label><select id="result-player">' +
    game.players.map(person => '<option value="' + esc(person.id) + '" ' + (person.id === activePlayerId ? 'selected' : '') + '>' + esc(person.name) + '</option>').join('') +
    '</select><label class="input-label" for="share-score">Copy this into your group chat</label><textarea id="share-score" rows="4" readonly></textarea>' +
    '<button class="primary" id="copy-score">Copy score</button><p class="muted" id="copy-status" role="status"></p></section>' +
    '<form class="box" id="compare-form" novalidate><h3>Add a friend’s score</h3><p class="muted">Scores are compared on this device. Friends keep their own boards; totals don’t sync automatically.</p>' +
    '<label class="input-label" for="friend-name">Friend’s name</label><input id="friend-name" maxlength="30" autocomplete="off" required>' +
    '<label class="input-label" for="friend-points">Points (0–' + MAX_POINTS + ')</label><input id="friend-points" type="number" min="0" max="' +
    MAX_POINTS + '" step="1" inputmode="numeric" required><p class="error" id="compare-error" role="alert"></p>' +
    '<button class="primary" type="submit">Add to comparison</button></form></div></section>';
  document.querySelector('#share-score').value = 'Sips & Seats — ' + player.name + '\n' + scoreFor(player.id) + ' / ' + MAX_POINTS +
    ' points · ' + Object.keys(game.ticks[player.id]).length + ' / ' + CATALOGUE.length + ' moments\n' + location.href.split(/[?#]/)[0];
  document.querySelector('#back-board').onclick = () => { view = 'board'; render(); };
  document.querySelector('#result-player').onchange = event => { activePlayerId = event.target.value; render(); };
  document.querySelector('#copy-score').onclick = async () => {
    try {
      await navigator.clipboard.writeText(document.querySelector('#share-score').value);
      document.querySelector('#copy-status').textContent = 'Score copied. Send it to your friends!';
    } catch (error) {
      document.querySelector('#share-score').focus();
      document.querySelector('#share-score').select();
      document.querySelector('#copy-status').textContent = 'Select and copy the score above to share it.';
    }
  };
  document.querySelector('#compare-form').onsubmit = event => {
    event.preventDefault();
    const name = document.querySelector('#friend-name').value.trim();
    const rawPoints = document.querySelector('#friend-points').value.trim();
    const points = Number(rawPoints);
    let error = '';
    if (!name || name.length > 30) error = 'Enter a name of 1–30 characters.';
    else if ([...game.players, ...game.comparisons].some(result => result.name.toLocaleLowerCase() === name.toLocaleLowerCase())) error = 'That name is already on the scoreboard. Use a different name, or remove the old comparison first.';
    else if (!rawPoints || !Number.isInteger(points) || points < 0 || points > MAX_POINTS) error = 'Enter a whole number from 0 to ' + MAX_POINTS + '.';
    if (error) {
      document.querySelector('#compare-error').textContent = error;
      return;
    }
    game.comparisons.push({id: 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2), name, points});
    persist();
    render();
    document.querySelector('#friend-name').focus();
  };
  app.querySelectorAll('[data-remove-result]').forEach(button => button.onclick = () => {
    game.comparisons = game.comparisons.filter(result => result.id !== button.dataset.removeResult);
    persist();
    render();
  });
}

function render() {
  document.querySelector('#new-game').hidden = !game && !invalidSave;
  if (!game) { setup(); return; }
  if (view === 'results') { renderResults(); return; }
  const count = Object.keys(game.ticks[activePlayerId]).length;
  const player = game.players.find(player => player.id === activePlayerId);
  app.innerHTML = '<section class="scoreboard" aria-label="Player scores">' + game.players.map((person, index) =>
    '<div class="score" style="--accent:hsl(' + ((index * 137.508 + 75) % 360) + ' 72% 75%)"><span>' + esc(person.name) +
    '</span><strong>' + scoreFor(person.id) + ' <small style="font-size:14px">/ ' + MAX_POINTS + ' pts</small></strong></div>').join('') +
    '</section><div class="board-toolbar"><label class="board-picker">Whose board?<select id="board-player">' +
    game.players.map(person => '<option value="' + esc(person.id) + '" ' + (person.id === activePlayerId ? 'selected' : '') + '>' + esc(person.name) + '</option>').join('') +
    '</select></label><button id="view-results">Results &amp; compare →</button></div><div class="overview"><div>' +
    '<div class="eyebrow" style="margin:0">' + esc(player.name) + '’s election-night bingo</div><h3>Spot it. Tick it. Build your score.</h3></div>' +
    '<div><strong>' + count + ' / ' + CATALOGUE.length + ' ticked</strong><div class="progress" aria-hidden="true"><i style="width:' +
    (count / CATALOGUE.length * 100) + '%"></i></div></div></div>' +
    (count === CATALOGUE.length ? '<p class="full-house" role="status">Full house! All ' + CATALOGUE.length + ' moments ticked. You’ve scored ' + MAX_POINTS + ' points!</p>' : '') +
    '<div class="filters" aria-label="Category">' + ['All', ...categories].map((cat, index) => '<button data-category="' + index +
    '" aria-pressed="' + (cat === category) + '">' + (cat === 'All' ? 'All categories' : esc(cat)) + ' <small>(' +
    CATALOGUE.filter(card => cat === 'All' || card.category === cat).length + ')</small></button>').join('') +
    '</div><div class="tools"><select id="status" aria-label="Tick status">' + ['All', 'To spot', 'Ticked'].map(label =>
    '<option ' + (label === status ? 'selected' : '') + '>' + label + '</option>').join('') +
    '</select><input id="search" aria-label="Search cards" placeholder="Search moments…" value="' + esc(search) +
    '" type="search"><button id="reset-view">Reset view</button></div><section id="cards" class="cards" aria-label="Election moments"></section>' +
    '<details><summary>How to play &amp; browser saves</summary><p>Tick each moment you spot to earn its points, once per card on your own board. Everyone can score the same card; you don’t have to be first. If one TV moment matches several cards, count one card; separate moments can score separately.</p>' +
    '<p>Play solo for a personal best or aim for a full house of all ' + CATALOGUE.length + ' moments. If you’re sharing a device, switch boards so each player can tick what they spotted. Each board has its own ticks and score.</p>' +
    '<p>Playing remotely? Everyone opens this site and starts their own game. Agree when to stop, then use Results &amp; compare to share totals and add friends’ scores. Highest points wins; equal totals tie. Scores don’t sync automatically.</p>' +
    '<p>The drink prompts are optional for the person ticking the card. Skip or substitute any drink without losing points.</p>' +
    '<p>Your game and comparison scores save in this browser at this site address. Use the same browser and address to return. New Game resets this device’s game after confirmation.</p></details>' +
    '<footer>Sips &amp; Seats · Your coverage, your calls.</footer>';
  document.querySelector('#board-player').onchange = event => {
    activePlayerId = event.target.value;
    clearTimeout(toastTimer);
    document.querySelector('#toast').hidden = true;
    render();
  };
  document.querySelector('#view-results').onclick = () => {
    view = 'results';
    clearTimeout(toastTimer);
    document.querySelector('#toast').hidden = true;
    render();
  };
  app.querySelectorAll('[data-category]').forEach(button => button.onclick = () => { category = ['All', ...categories][+button.dataset.category]; render(); });
  document.querySelector('#status').onchange = event => { status = event.target.value; renderCards(); };
  document.querySelector('#search').oninput = event => { search = event.target.value; renderCards(); };
  document.querySelector('#reset-view').onclick = () => { category = 'All'; status = 'All'; search = ''; render(); };
  renderCards();
}

load();
render();
</script></html>
